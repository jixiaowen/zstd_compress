name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc make libhdfs-dev libzstd-dev libzstd1
    
    - name: Build with make
      run: |
        make
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: zstd_compress
        path: zstd_compress