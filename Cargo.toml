[package]
name = "zstd_compress"
version = "0.1.0"
edition = "2024"

[dependencies]
hdfs = "0.0.4"
zstd = { version = "0.13", features = ["zstdmt"] }
clap = { version = "4.5", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
thiserror = "1.0"
futures = "0.3"
tokio = { version = "1.35", features = ["full"] }
anyhow = "1.0"
